<script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>

<script>
//your jquery script here
//with this first line we're saying: "when the page loads (document is ready) run the following script"
$(document).ready(function () {

//select the POPUP FRAME and show it
$("#popup").hide().fadeIn(1000);

//close the POPUP if the button with id="close" is clicked
$("#close").on("click", function (e) {
    e.preventDefault();
    $("#popup").fadeOut(1000);
});

});


</script>

<script>
    //captura variaveis passadas via metodo get na url.
    var urlAtual = window.location.href;
    var urlClass = new URL(urlAtual);
    var page = urlClass.searchParams.get("p")+ ".html";
    
    // a variavel p (?p=nome_da_pagina) representa a página que eu quero carregar. Se ela não estiver definida, carrega a inicio
    if(page == "null.html") {
        page = "inicio.html";
    }else{
        $(".banner").hide();
    }
    
    includeElement = document.getElementById("pageBody");
    includeElement.setAttribute('src', page);

    //carrego as paginas no atributo src das tags smarty-include
    loadPage();

    

</script>
